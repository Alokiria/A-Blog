[build]
publish = "dist"
command = "npm run build"

[build.environment]
# Valaxy 1.0 要求 Node.js >= 22.12.0（Vite 8 + unplugin-vue-markdown 32）
NODE_VERSION = "22"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"
